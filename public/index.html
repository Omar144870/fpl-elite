<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FPL Elite — لايف، توقعات، وتبديلات</title>
  <meta name="description" content="اكتب رقم فريقك في فانتازي الدوري الإنجليزي واحصل على النقاط الحية، توقعات النقاط، أفضل تبديلات، الكابتن، وخطة التشيبس." />
  <meta name="theme-color" content="#1d5e43" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="FPL Elite">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--pitch)"/><path d="M16 1v30M1 16h30" stroke="var(--chalk)" stroke-width="1.4" opacity=".55"/><circle cx="16" cy="16" r="5.5" fill="none" stroke="var(--chalk)" stroke-width="1.4" opacity=".8"/><circle cx="16" cy="16" r="2.2" fill="var(--gold)"/></svg>
      <span>FPL Elite</span>
    </a>
    <form class="idform" id="idform" autocomplete="off">
      <label class="sr" for="teamid" data-i18n="teamIdLabel">رقم الفريق</label>
      <input id="teamid" inputmode="numeric" pattern="[0-9]*" maxlength="9" data-i18n-ph="teamIdPh" placeholder="رقم الفريق" />
      <button type="submit" data-i18n="load">افتح</button>
    </form>
    <div class="tools">
      <button class="iconbtn" id="langbtn" type="button" aria-label="Language">EN</button>
      <button class="iconbtn" id="themebtn" type="button" aria-label="Theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-card">
      <button class="modal-x" id="modalx" type="button" aria-label="Close">×</button>
      <div id="modalbody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
